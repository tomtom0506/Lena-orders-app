function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ""));
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// resize + compress an uploaded image file to a small base64 JPEG data URI
function fileToCompressedDataUrl(file, maxSize = 400, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSize) {
          height = Math.round((height * maxSize) / width);
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round((width * maxSize) / height);
          height = maxSize;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// pulls the numeric amount out of a price string/number, ignoring currency symbols/text
function parseAmount(priceVal) {
  if (priceVal === undefined || priceVal === null || priceVal === "") return 0;
  const str = String(priceVal).replace(/[,\s]/g, "");
  const m = str.match(/(\d+(\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}

// legacy orders (before the currency field existed) kept the currency inside the price text
function inferCurrency(order) {
  if (order.currency) return order.currency;
  const str = String(order.price || "");
  if (str.includes("$")) return "$";
  if (str.includes("€")) return "€";
  if (str.includes("₪") || str.includes("ש״ח") || str.includes('ש"ח')) return "₪";
  return null; // unknown currency - excluded from revenue totals
}

// display string for a price: new-style orders have amount+currency separately
function formatPrice(order) {
  if (!order.price) return "";
  if (order.currency) return `${parseAmount(order.price) || order.price}${order.currency}`;
  return order.price; // legacy free-text price (e.g. "560 ש״ח")
}

// totals per currency, e.g. { "₪": 1200, "$": 80 }
function revenueByCurrency(orders) {
  const totals = {};
  orders.forEach((o) => {
    const cur = inferCurrency(o);
    if (!cur) return;
    const amount = parseAmount(o.price) * (o.qty || 1);
    totals[cur] = (totals[cur] || 0) + amount;
  });
  return totals;
}

  const [photoLibrary, setPhotoLibrary] = useState([]); // shared pool of uploaded photos, selectable on any order

  function toggleFilter(setFn, options, opt) {
    setFn((prev) => {
      const next = new Set(prev);
      if (next.has(opt)) next.delete(opt);
      else next.add(opt);
      return next;
    });
  }

  function toggleFilterAll(setFn, options) {
    setFn((prev) => (prev.size === options.length ? new Set() : new Set(options)));
  }

  function addPhotoToLibrary(dataUrl) {
    const id = uid();
    setPhotoLibrary((prev) => [{ id, dataUrl }, ...prev]);
    return dataUrl;
  }

  const [config, setConfig] = useState(null); // {owner, repo, token}
  const [sha, setSha] = useState(null);
  const skipNextSaveRef = useRef(true); // avoid re-saving unchanged data right after it was just loaded
  const [showSettings, setShowSettings] = useState(false);
  const [cfgOwner, setCfgOwner] = useState("");
  const [cfgRepo, setCfgRepo] = useState("");
  const [cfgToken, setCfgToken] = useState("");

  // read saved GitHub connection from this browser on first load
  useEffect(() => {
    try {
      const raw = localStorage.getItem(CONFIG_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setConfig(parsed);
        setCfgOwner(parsed.owner || "");
        setCfgRepo(parsed.repo || "");
        setCfgToken(parsed.token || "");
      } else {
        setShowSettings(true);
        setLoading(false);
      }
    } catch (e) {
      setShowSettings(true);
      setLoading(false);
    }
  }, []);

  // load orders.json from the GitHub repo once we have a connection
  useEffect(() => {
    if (!config) return;
    let cancelled = false;
    setLoading(true);
    skipNextSaveRef.current = true;
    (async () => {
      try {
        const res = await fetch(

          // first time - seed from the imported Excel data
          const seeded = SEED_ORDERS.map((o) => ({ ...o, id: uid(), photo: ORDER_IMAGES[String(o.orderNumber)] || "" }));
          if (!cancelled) { setOrders(seeded); setPhotoLibrary([]); setSha(null); }
          return;
        }
        if (!res.ok) throw new Error(`שגיאה בטעינה (${res.status}). בדוק שם משתמש, ריפו וטוקן.`);
        const data = await res.json();
        if (cancelled) return;
        const parsed = JSON.parse(base64ToUtf8(data.content));
        // backwards compatible with the old format where the file was just an array of orders
        if (Array.isArray(parsed)) {
          setOrders(parsed);
          setPhotoLibrary([]);
        } else {
          setOrders(parsed.orders || []);
          setPhotoLibrary(parsed.photoLibrary || []);
        }
        setSha(data.sha);
        setSaveError(false);
      } catch (e) {
        if (!cancelled) setSaveError(true);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [config]);

    if (loading || orders === null || !config) return;

      // skip this one to avoid firing a redundant (and potentially conflicting) save
      skipNextSaveRef.current = false;
      return;
    }
    (async () => {
      try {
        const body = {
          message: "עדכון הזמנות דרך האפליקציה",
          content: utf8ToBase64(JSON.stringify({ orders, photoLibrary }, null, 2)),
        };
        if (sha) body.sha = sha;
        const res = await fetch(
          `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${ORDERS_FILE}`,
          {
            method: "PUT",
            headers: {
              Authorization: `token ${config.token}`,
              Accept: "application/vnd.github.v3+json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),

        if (!res.ok) throw new Error(`שמירה נכשלה (${res.status})`);
        const data = await res.json();

  async function exportToExcel(allOrders) {

    setExporting(true);

      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet("הזמנות");
      sheet.views = [{ rightToLeft: true }];
      sheet.columns = [
        { header: "מס' הזמנה", key: "orderNumber", width: 10 },
        { header: "מידה", key: "size", width: 10 },
        { header: "מחיר", key: "price", width: 12 },
        { header: "מטבע", key: "currency", width: 8 },
        { header: "כמות", key: "qty", width: 8 },
        { header: "שם קונה", key: "buyerName", width: 24 },
        { header: "אימייל", key: "buyerEmail", width: 24 },
        { header: "טלפון", key: "buyerPhone", width: 16 },
        { header: "סטטוס משלוח", key: "deliveryStatus", width: 14 },
        { header: "סטטוס תשלום", key: "paymentStatus", width: 14 },
        { header: "פרטי תשלום", key: "paymentNotes", width: 24 },
        { header: "הערות", key: "notes", width: 34 },
        { header: "תמונה", key: "photoCol", width: 16 },
      ];
      sheet.getRow(1).font = { bold: true };
      sheet.getRow(1).alignment = { horizontal: "center" };

      allOrders.forEach((o, i) => {
        const row = sheet.addRow({
          orderNumber: o.orderNumber,
          size: o.size,
          price: o.price,
          currency: o.currency || "",
          qty: o.qty,
          buyerName: o.buyerName,
          buyerEmail: o.buyerEmail,
          buyerPhone: o.buyerPhone,
          deliveryStatus: o.deliveryStatus,
          paymentStatus: o.paymentStatus,
          paymentNotes: o.paymentNotes,
          notes: o.notes,
        });
        row.height = 78;
        row.alignment = { vertical: "middle", wrapText: true };

        if (o.photo && typeof o.photo === "string" && o.photo.startsWith("data:image")) {
          const match = o.photo.match(/^data:image\/(\w+);base64,(.*)$/);
          if (match) {
            let ext = match[1].toLowerCase();
            if (ext === "jpg") ext = "jpeg";
            if (ext === "jpeg" || ext === "png" || ext === "gif") {
              try {
                const imageId = workbook.addImage({ base64: match[2], extension: ext });
                sheet.addImage(imageId, {
                  tl: { col: 11, row: i + 1 },
                  ext: { width: 90, height: 90 },
                });
              } catch (e) {
                console.error("embed image failed for order", o.orderNumber, e);
              }
            }
          }
        }
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `הזמנות-לנה-${dateStr}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error("export failed", e);
      alert("הייצוא נכשל, נסי שוב");
    } finally {
      setExporting(false);
    }
  }

        <>
          {saveError && (
            <div className="save-flag">⚠ השמירה נכשלה כרגע — הנתונים עדיין מוצגים, נסי שוב בעוד רגע</div>
          )}

          <div className="stats-row">
            <div className="stat-card">
              <div className="stat-num">{stats.total}</div>
              <div className="stat-label">סה״כ הזמנות</div>
            </div>
            <div className="stat-card">
              <div className="stat-num warn">{stats.waiting + stats.inPrep}</div>
              <div className="stat-label">בהכנה / ממתין</div>
            </div>
            <div className="stat-card">
              <div className="stat-num bad">{stats.unpaid}</div>
              <div className="stat-label">חוב פתוח</div>
            </div>
            {CURRENCY_OPTIONS.filter((c) => stats.revenue[c] > 0).map((c) => (
              <div className="stat-card" key={c}>
                <div className="stat-num">{c}{stats.revenue[c].toLocaleString()}</div>
                <div className="stat-label">הערכת מכירות ({c})</div>
              </div>
            ))}
          </div>

          <div className="toolbar">
            <input
              className="search-input"
              placeholder="חיפוש לפי שם קונה, מספר הזמנה, מידה…"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            <div className="filter-row">
              <button
                className={`chip chip-all ${deliveryFilter.size === DELIVERY_OPTIONS.length ? "active" : ""}`}
                onClick={() => toggleFilterAll(setDeliveryFilter, DELIVERY_OPTIONS)}
              >
                הכל
              </button>
              {DELIVERY_OPTIONS.map((opt) => (
                <button
                  key={opt}
                  className={`chip ${deliveryFilter.has(opt) ? "active" : ""}`}
                  onClick={() => toggleFilter(setDeliveryFilter, DELIVERY_OPTIONS, opt)}
                >
                  {opt}
                </button>
              ))}
            </div>
            <div className="filter-row">
              <button
                className={`chip chip-all ${paymentFilter.size === PAYMENT_OPTIONS.length ? "active" : ""}`}
                onClick={() => toggleFilterAll(setPaymentFilter, PAYMENT_OPTIONS)}
              >
                הכל
              </button>
              {PAYMENT_OPTIONS.map((opt) => (
                <button
                  key={opt}
                  className={`chip ${paymentFilter.has(opt) ? "active" : ""}`}
                  onClick={() => toggleFilter(setPaymentFilter, PAYMENT_OPTIONS, opt)}
                >
                  {opt}
                </button>
              ))}
            </div>
            <button
              className="sort-btn"
              onClick={() => setSortDir((d) => (d === "asc" ? "desc" : "asc"))}
            >
              מיון: מספר הזמנה {sortDir === "asc" ? "↑ מהישן לחדש" : "↓ מהחדש לישן"}
            </button>
            <button
              className="sort-btn"
              disabled={exporting}
              onClick={() => exportToExcel(orders)}
              style={{ background: "#55684F", color: "#FFFDF9", borderColor: "#55684F" }}
            >
              {exporting ? "מייצא…" : "⬇ ייצוא לאקסל (כולל תמונות)"}
            </button>
          </div>

          <div className="list">
            {filtered.length === 0 && (
              <div className="empty-state">
                <div className="glyph">✎</div>
                אין הזמנות תואמות. נסי לשנות את החיפוש או הסינון.
              </div>
            )}
            {filtered.map((o) => (
              <OrderCard
                key={o.id}
                order={o}
                onEdit={() => setEditing(o)}
                onDelete={() => setConfirmDelete(o)}
                onQuickSet={quickSetStatus}
              />
            ))}
          </div>

          <button className="add-btn" onClick={() => setEditing(emptyOrder(nextOrderNumber()))}>
            +
          </button>
        </>
      )}

      {editing && (
        <EditModal
          order={editing}
          photoLibrary={photoLibrary}
          onAddPhotoToLibrary={addPhotoToLibrary}
          onCancel={() => setEditing(null)}
          onSave={handleSave}
        />
      )}

      {confirmDelete && (
        <div className="overlay" onClick={() => setConfirmDelete(null)}>
          <div className="confirm-box" onClick={(e) => e.stopPropagation()}>
            <p>למחוק את הזמנה #{confirmDelete.orderNumber}?</p>
            <div className="modal-actions">
              <button className="btn btn-secondary" onClick={() => setConfirmDelete(null)}>
                ביטול
              </button>
              <button className="btn btn-primary" style={{ background: "#A6473A" }} onClick={() => handleDelete(confirmDelete.id)}>
                מחיקה
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function OrderCard({ order, onEdit, onDelete, onQuickSet }) {
  const [expanded, setExpanded] = useState(false);
  const dColor = DELIVERY_COLORS[order.deliveryStatus] || DELIVERY_COLORS["לא ידוע"];
  const pColor = PAYMENT_COLORS[order.paymentStatus] || PAYMENT_COLORS["לא ידוע"];

  return (
    <div className="card" style={{ "--accent": dColor.dot }}>
      <div className="card-top">
        <div className="card-photo" onClick={onEdit}>
          {order.photo ? (
            <img src={order.photo} alt={`עבודה #${order.orderNumber}`} />
          ) : (
            <span className="photo-placeholder">🏺</span>
          )}
        </div>
        <div>
          <span className="tag">{order.orderNumber}</span>
          <div className="size-price">
            {order.size && <b>{order.size}</b>}
            {order.size && order.price ? " · " : ""}
            {formatPrice(order)}
            {order.qty > 1 ? ` · כמות ${order.qty}` : ""}
          </div>
        </div>
      </div>

      <div className="buyer-block">
        <div className="buyer-name">{order.buyerName || "— ללא שם קונה —"}</div>
        {(order.buyerEmail || order.buyerPhone) && (
          <div className="buyer-contacts">
            {order.buyerEmail && <a href={`mailto:${order.buyerEmail}`}>{order.buyerEmail}</a>}
            {order.buyerPhone && <a href={`tel:${order.buyerPhone}`}>{order.buyerPhone}</a>}
          </div>
        )}
      </div>

      <div className="status-row">
        <select
          className="status-select"
          style={{ background: dColor.bg, color: dColor.fg }}
          value={order.deliveryStatus}
          onChange={(e) => onQuickSet(order.id, "deliveryStatus", e.target.value)}
        >
          {DELIVERY_OPTIONS.map((opt) => (
            <option key={opt} value={opt}>
              {opt}
            </option>
          ))}
        </select>
        <select
          className="status-select"
          style={{ background: pColor.bg, color: pColor.fg }}
          value={order.paymentStatus}
          onChange={(e) => onQuickSet(order.id, "paymentStatus", e.target.value)}
        >
          {PAYMENT_OPTIONS.map((opt) => (
            <option key={opt} value={opt}>
              {opt}
            </option>
          ))}
        </select>
      </div>

      {(order.notes || order.paymentNotes) && (
        <>
          <div className={`notes-preview ${expanded ? "expanded" : ""}`}>
            {order.paymentNotes && <div>💳 {order.paymentNotes}</div>}
            {order.notes}
          </div>
          <span className="notes-toggle" onClick={() => setExpanded((v) => !v)}>
            {expanded ? "הסתר הערות" : "הצג הערות מלאות"}
          </span>
        </>
      )}

      <div className="card-actions">
        <button className="action-btn" onClick={onEdit}>
          ✎ עריכה
        </button>
        <button className="action-btn danger" onClick={onDelete}>
          🗑 מחיקה
        </button>
      </div>
    </div>
  );
}

function EditModal({ order, photoLibrary, onAddPhotoToLibrary, onCancel, onSave }) {
  const [form, setForm] = useState(() => ({ currency: "₪", ...order }));
  const [showGallery, setShowGallery] = useState(false);

  function set(field, value) {
    setForm((f) => ({ ...f, [field]: value }));
  }

  async function handlePhotoChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await fileToCompressedDataUrl(file);
      onAddPhotoToLibrary(dataUrl); // adds to the shared pool so it can be reused on other orders too
      set("photo", dataUrl);
      setShowGallery(false);
    } catch (err) {
      // ignore failed image read, keep previous photo
    }
  }

  function submit(e) {
    e.preventDefault();
    onSave({ ...form, orderNumber: Number(form.orderNumber) || 0, qty: Number(form.qty) || 1 });
  }

  return (
    <div className="overlay" onClick={onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-title">
          {order.buyerName || order.notes ? `עריכת הזמנה #${order.orderNumber}` : "הזמנה חדשה"}
        </div>
        <form onSubmit={submit}>
          <div className="field">
            <label>תמונת הפריט</label>
            <div className="photo-upload-row">
              <div className="photo-upload-preview">
                {form.photo ? <img src={form.photo} alt="" /> : <span className="photo-placeholder">🏺</span>}
              </div>
              {photoLibrary && photoLibrary.length > 0 && (
                <button
                  type="button"
                  className="photo-upload-btn"
                  onClick={() => setShowGallery((s) => !s)}
                >
                  {showGallery ? "סגירת גלריה" : "בחירה מתמונות קיימות"}
                </button>
              )}
              <label className="photo-upload-btn">
                {form.photo ? "החלפת תמונה" : "העלאת תמונה"}
                <input type="file" accept="image/*" onChange={handlePhotoChange} hidden />
              </label>
              {form.photo && (
                <button type="button" className="photo-remove-btn" onClick={() => set("photo", "")}>
                  הסרה
                </button>
              )}
            </div>
            {showGallery && (
              <div className="photo-gallery">
                {photoLibrary.map((p) => (
                  <button
                    type="button"
                    key={p.id}
                    className={`photo-gallery-item ${form.photo === p.dataUrl ? "selected" : ""}`}
                    onClick={() => {
                      set("photo", p.dataUrl);
                      setShowGallery(false);
                    }}
                  >
                    <img src={p.dataUrl} alt="" />
                  </button>
                ))}
              </div>
            )}
          </div>

          <div className="field-row">
            <div className="field">
              <label>מס׳ הזמנה</label>
              <input
                type="number"
                value={form.orderNumber}
                onChange={(e) => set("orderNumber", e.target.value)}
              />
            </div>
            <div className="field">
              <label>מידה</label>
              <input value={form.size} onChange={(e) => set("size", e.target.value)} placeholder="12X5" />
            </div>
          </div>

          <div className="field-row">
            <div className="field">
              <label>מחיר</label>
              <input value={form.price} onChange={(e) => set("price", e.target.value)} placeholder="560" />
            </div>
            <div className="field">
              <label>מטבע</label>
              <select value={form.currency || "₪"} onChange={(e) => set("currency", e.target.value)}>
                {CURRENCY_OPTIONS.map((c) => (
                  <option key={c} value={c}>
                    {CURRENCY_LABELS[c]}
                  </option>
                ))}
              </select>
            </div>
            <div className="field">
              <label>כמות</label>
              <input type="number" min="1" value={form.qty} onChange={(e) => set("qty", e.target.value)} />
            </div>
          </div>

          <div className="field">
            <label>שם הקונה</label>
            <input value={form.buyerName} onChange={(e) => set("buyerName", e.target.value)} />
          </div>

          <div className="field-row">
            <div className="field">
              <label>אימייל</label>
              <input value={form.buyerEmail} onChange={(e) => set("buyerEmail", e.target.value)} />
            </div>
            <div className="field">
              <label>טלפון</label>
              <input value={form.buyerPhone} onChange={(e) => set("buyerPhone", e.target.value)} />
            </div>
          </div>

          <div className="field-row">
            <div className="field">
              <label>סטטוס מסירה</label>
              <select value={form.deliveryStatus} onChange={(e) => set("deliveryStatus", e.target.value)}>
                {DELIVERY_OPTIONS.map((o) => (
                  <option key={o} value={o}>
                    {o}
                  </option>
                ))}
              </select>
            </div>
            <div className="field">
              <label>סטטוס תשלום</label>
              <select value={form.paymentStatus} onChange={(e) => set("paymentStatus", e.target.value)}>
                {PAYMENT_OPTIONS.map((o) => (
                  <option key={o} value={o}>
                    {o}
                  </option>
                ))}
              </select>
            </div>
          </div>

          <div className="field">
            <label>פרטי תשלום (סכום ששולם, יתרה וכו׳)</label>
            <input value={form.paymentNotes} onChange={(e) => set("paymentNotes", e.target.value)} />
          </div>

          <div className="field">
            <label>הערות</label>
            <textarea value={form.notes} onChange={(e) => set("notes", e.target.value)} />
          </div>

          <div className="modal-actions">
            <button type="button" className="btn btn-secondary" onClick={onCancel}>
              ביטול
            </button>
            <button type="submit" className="btn btn-primary">
              שמירה
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);

function Root() {
  const [unlocked, setUnlocked] = useState(() => localStorage.getItem(LOCK_KEY) === "1");
  if (!unlocked) return <LockScreen onUnlock={() => setUnlocked(true)} />;
  return <LenaOrdersApp />;
}

root.render(<Root />);
</script>
</body>
</html>
